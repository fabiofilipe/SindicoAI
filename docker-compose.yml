services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    networks:
      - sindicoai-network

  frontend-morador:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: morador
      target: builder
    command: npm run dev
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/morador:/app/morador
      - /app/morador/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sindicoai-network

  frontend-funcionario:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: funcionario
      target: builder
    command: npm run dev
    ports:
      - "3001:5173"
    volumes:
      - ./frontend/funcionario:/app/funcionario
      - /app/funcionario/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sindicoai-network

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: admin
      target: builder
    command: npm run dev
    ports:
      - "3002:5173"
    volumes:
      - ./frontend/admin:/app/admin
      - /app/admin/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sindicoai-network

  frontend-landing:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: landing
      target: builder
    command: npm run dev
    ports:
      - "3003:5173"
    volumes:
      - ./frontend/landing:/app/landing
      - /app/landing/node_modules
    networks:
      - sindicoai-network

  db:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sindicoai-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - sindicoai-network

networks:
  sindicoai-network:
    driver: bridge

volumes:
  postgres_data:
